services:
  postgres:
    image: postgres:17-alpine
    container_name: school-control-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-school}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-school123}
      POSTGRES_DB: ${DB_NAME:-school_control}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
